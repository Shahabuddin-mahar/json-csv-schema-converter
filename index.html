<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DataMorph - JSON & CSV Bidirectional Transformer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen p-6">
  <div class="max-w-4xl mx-auto">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-extrabold text-white">JSON ⇄ CSV Transformer</h1>
      <p class="text-xs text-gray-400">100% Client-Side. Your private data never leaves your browser.</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-semibold text-gray-300 mb-1">JSON Input</label>
        <textarea id="json-input" rows="12" class="w-full bg-gray-900 border border-gray-800 rounded-xl p-3 font-mono text-xs text-gray-200">[
  {"id": 1, "name": "Shahabuddin", "role": "Architect"},
  {"id": 2, "name": "Sarah", "role": "Engineer"}
]</textarea>
        <button onclick="jsonToCsv()" class="w-full mt-2 bg-indigo-600 hover:bg-indigo-500 font-bold py-2 rounded-lg text-xs text-white">Convert JSON to CSV ➔</button>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-300 mb-1">CSV Output / Input</label>
        <textarea id="csv-input" rows="12" class="w-full bg-gray-900 border border-gray-800 rounded-xl p-3 font-mono text-xs text-emerald-400"></textarea>
        <button onclick="csvToJson()" class="w-full mt-2 bg-emerald-600 hover:bg-emerald-500 font-bold py-2 rounded-lg text-xs text-white">⬅ Convert CSV to JSON</button>
      </div>
    </div>
  </div>

  <script>
    function jsonToCsv() {
      try {
        const obj = JSON.parse(document.getElementById("json-input").value);
        const keys = Object.keys(obj[0]);
        let csv = keys.join(",") + "\n";
        obj.forEach(row => {
          csv += keys.map(k => `"${row[k] || ''}"`).join(",") + "\n";
        });
        document.getElementById("csv-input").value = csv;
      } catch (e) {
        alert("Invalid JSON format.");
      }
    }

    function csvToJson() {
      const csv = document.getElementById("csv-input").value.trim();
      const lines = csv.split("\n");
      const headers = lines[0].split(",").map(h => h.trim().replace(/^"|"$/g, ''));
      const list = [];
      for (let i = 1; i < lines.length; i++) {
        const cells = lines[i].split(",").map(c => c.trim().replace(/^"|"$/g, ''));
        const obj = {};
        headers.forEach((h, idx) => obj[h] = cells[idx]);
        list.push(obj);
      }
      document.getElementById("json-input").value = JSON.stringify(list, null, 2);
    }
    jsonToCsv();
  </script>
</body>
</html>
